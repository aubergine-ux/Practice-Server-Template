#
# Event settings
EVENT:
  MULTIPLE: false # If true, multiple events can happen in the same time. But only one can be in the collecting phase.
  AUTO-EVENTS: true
  DUEL:
    POST-KILL-DELAY: 3 # Seconds to wait after a duel-event elimination before forwarding/next round. (alias: event-post-kill-delay)
  ENDERPEARL-COOLDOWN: 10 # In sec.
  BROADCAST:
    ENABLE: true
    MESSAGE-TO:
      IN-PARTY: true # If true and the player is a member of a party, he will receive the broadcast message.
      IN-UNRANKED-MATCH: true # If true and the player is in an unranked match, he will receive the broadcast message.
      IN-RANKED-MATCH: false # If true and the player is in a ranked match, he will receive the broadcast message.
      IN-EVENT: true # If true and the player is in another event, he will receive the broadcast message.
  PLAYER-TRACKER: # Shows the nearest player.
    NAME: <red>Player Tracker <gray>(Right-Click)
    MATERIAL: COMPASS
  LMS: # Please be aware that building is not yet supported for the event.
    NAME: LMS
    WINNER-COMMAND:
    - practice ranked add %player% 3
    AUTO-EVENTS: # At this time of the day an automatic lms event is going to start. You can extend the list, and add it to other events as well. If you have any question about this, please join the discord server.
      - 18:30
  OITC:
    NAME: OITC
    SETTINGS:
      PLAYER-LIFE: 5 # Every player gets this many lives. When they die, they loose 1 life.
    WINNER-COMMAND:
    - practice ranked add %player% 3
    - eco give %player% 10
  TNTTAG:
    NAME: TNT Tag
    WINNER-COMMAND:
    - practice ranked add %player% 3
    TAGGED-ITEM:
      NAME: <red>You're IT, tag someone!
      MATERIAL: TNT
  BRACKETS: # Please be aware that building is not yet supported for the event.
    NAME: Brackets
    WINNER-COMMAND:
    - practice ranked add %player% 3
  SUMO:
    NAME: Sumo
    WINNER-COMMAND:
    - practice ranked add %player% 3
  SPLEGG: # Please be aware that building is not yet supported for the event.
    NAME: Splegg
    WINNER-COMMAND:
    - practice ranked add %player% 3
    BREAKABLE-MATERIALS: # Generic entries like WOOL or TERRACOTTA also match colored variants.
      - WOOL
    EGG-LAUNCHER-ITEM:
      NAME: <green>Shoot The Blocks <gray>(Right-Click)
      MATERIAL: IRON_SHOVEL
  JUGGERNAUT: # Please be aware that building is not yet supported for the event.
    NAME: Juggernaut
    WINNER-COMMAND:
    - practice ranked add %player% 3
#
# Player settings
PLAYER:
  DELETE-INACTIVE-USER:
    ENABLED: true
    DAYS: 30 # After this number of days, the inactive player profiles will be deleted.
  SETTINGS-DELAY: 3 # Sec between settings can be changed. It can be bypassed.
  LOBBY-PROTECTION:
    allow-velocity: false # player don't get damaged but they get knocked back
    allow-damage: false
    allow-inventory-interact: false
    allow-item-drop: false
    allow-item-pickup: false
    allow-hunger: false
    allow-block-break: false
    allow-block-place: false
    allow-lobby-interact: false
  LOBBY-COSMETICS:
    DEFAULT-LOBBY-COSMETIC: NONE # Lobby cosmetic for players who never picked one: NONE, ELYTRA, WIND_CHARGE, TRIDENT or SPEAR
    SLOTS: # Where each lobby cosmetic item goes: OFF_HAND or a hotbar slot 0-8 (first free slot if taken)
      ROCKETS: OFF_HAND
      WIND_CHARGE: OFF_HAND
      TRIDENT: OFF_HAND
      SPEAR: OFF_HAND
    PLAYER-SWAP: false # Let players press F (swap hands) to move their lobby cosmetic item between the off hand and the hotbar
    LEFT-CLICK-TRIGGER: true # Trident and Spear lunge on left-click too. Set to false for right-click only (useful with NPC plugins that react to any click).
  NICKNAME:
    VALIDATION-PATTERN: ^[a-zA-Z0-9_]{3,16}$
  LOBBY-NAMETAG:
    ENABLED: true
    TEXT-SHADOW: false # If true, a drop shadow is drawn behind lobby players' nametags.
    BACKGROUND: 0 # Background of lobby players' nametags as an ARGB value, 0 for none.
    TOP-LINE: '' # Line drawn above lobby players' nametags, supports PlaceholderAPI placeholders.
    BOTTOM-LINE: '' # Line drawn below lobby players' nametags, supports PlaceholderAPI placeholders.
  NAMETAG-MANAGEMENT:
    ENABLED: true # If false, ZonePractice will not manage nametags (above-head prefix/suffix/color) or the tab-list at all.
  JOIN-TELEPORT-LOBBY: true # If true, the player will be teleported to the lobby when they join the server.
  JOIN-MESSAGE: false # If true, the default Minecraft join message will be shown when a player joins.
  GROUP-CHAT:
    ENABLED: true # If enabled, the player's chat will be formatted by their group. It is only viable if "SERVER-CHAT" is also enabled.
  DEFAULT-SETTINGS:
    DUELREQUEST: true
    AUTOQUEUE: false
    SIDEBAR: true
    HIDEPLAYERS: false
    PARTYINVITES: true
    ALLOWSPECTATE: true
    PRIVATEMESSAGE: true
    FLYING: false
    WORLD-TIME: DAY # Options: SUNRISE, DAY, SUNSET, NIGHT
    PREFIX-VISIBILITY: PREFIX_AND_SUFFIX # Options: NONE, PREFIX, SUFFIX, PREFIX_AND_SUFFIX
#
# Division settings
DIVISIONS:
  ENABLED: true
  NEW-DIVISION-MESSAGE: true
  MIN-DIVISION-FOR-RANKED: SILVER2 # Have to give the config name, not the full name
#
# Chat settings
CHAT:
  SERVER-CHAT-ENABLED: true
  ISOLATE-MATCH-CHAT: true # If true, active match/FFA players only see messages from fighters in their own ongoing fight.
  SHOW-MATCH-CHAT-TO-SPECTATORS: true # If true, match spectators also see chat from the fighters they watch.
  PARTY-CHAT:
    ENABLED: true
    SHORTCUT: '@' # Prefix a message with this symbol to send it to your party once. Use /party chat to toggle party chat mode. Set to "" or false to disable the shortcut.
  STAFF-CHAT:
    ENABLED: true
    SHORTCUT: true # If true, you can use send message like #hello world instead of enabling staff chat each time.
  PRIVATE-CHAT-ENABLED: true # Private message system /message (/m) and /reply (/re, /r).

UPDATE-CHECKER:
  ENABLED: false # Checks for a newer plugin release on startup.

DEBUG:
  ACTIONBAR:
    ENABLED: false # Enables detailed action-bar lifecycle logs and in-memory history.
    TARGETS:
      # Optional player-name list. Empty = all players.
      []
