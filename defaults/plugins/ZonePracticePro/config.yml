#
# Sidebar settings
SIDEBAR:
  ENABLED: true # If false, the sidebar is fully disabled for all players regardless of profile setting.
  UPDATE-TIME: 20 # In ticks. 20 ticks = 1 second
#
# Arena settings
ARENA:
  LOAD-CHUNKS: true # If true, the server will load the enabled arena's chunks.
  TELEPORT-TO-COPY: false # Recommend: false,  If you copy an arena, the server will teleport you there, so you can watch it happening.
  FAST-COPY: # If true, the server more likely to be slow, but it triples the copy performance. 100x50x65 arena copy takes 1,5 minutes with fast copy.
    USE-FAWE: false
    ENABLED: true
    MULTIPLIER: 10 # Be careful with this value.
  DEFAULT-ICON: # If default icon is enabled it won't be necessary to set an arena icon, but you still can.
    ENABLED: false
    ICON:
      NAME: <gold>%arena%
      MATERIAL: FIREWORK_STAR
  # DAMAGE: 4 # You can set the damage to the material as well.
  GATES: # Gates are map blocks around the spawns that open with an animation when the round starts. Mark them with the arena setup wand (Gates mode).
    DEFAULT-ANIMATION: SINK # Used by arenas without their own animation: INSTANT, SINK, RISE, SHRINK, DOORS, SHATTER, WAVE or RANDOM.
    DURATION: 20 # Length of the animation in ticks (20 ticks = 1 second), 5-100.
    PARTICLES: true # Block particles for the INSTANT, SHATTER and WAVE animations.
    MAX-BLOCKS: 256 # Maximum number of blocks in one gate.
#
# Shrinking border settings
SHRINKING-BORDER:
  ENABLED: true # Master switch. If false, no shrinking border is created in any match, whatever the ladder settings say.
  WARNING-DISTANCE: 5 # Distance in blocks from the border at which players' screens start to turn red.
  ANNOUNCE-BEFORE: 10 # Seconds before the border starts shrinking to warn the players. 0 to disable.
  DEFAULTS: # Starting values for ladders without their own border settings. Change them per ladder in the ladder Settings GUI.
    START-DELAY: 120 # Seconds after the round starts before the border begins to shrink.
    SHRINK-DURATION: 120 # Seconds the border takes to shrink from the arena's size to FINAL-SIZE.
    FINAL-SIZE: 10 # Side length of the border in blocks once it stops shrinking.
    DAMAGE: 1.0 # Damage dealt to a player outside the border (2.0 = one heart). Ignores armor.
    DAMAGE-INTERVAL: 1 # Seconds between two damage ticks while a player is outside the border.
#
# Pillars of Fortune ladder settings
PILLARS:
  EVERYTHING: # Item pool of Pillars ladders with Everything Mode on. Interval and amount are set per ladder in the ladder Settings GUI.
    BLOCK-AMOUNT: 1 # Blocks are given in stacks of this size. Other items are given one at a time.
    # Items that are never given. Use material names; * matches any text (e.g. "*_SAPLING").
    # Spawn eggs, boats, minecarts and other entity items are listed because their entities are not removed when the match ends.
    BLACKLIST:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
