VERSION: 7

#
# Spawn inventories
# Set the slot to -1 if you don't want to display the item.
#
LOBBY-BASIC:
  NORMAL:
    QUEUE:
      SLOT: 0
      ITEM:
        NAME: <gold>Play <gray>(Right-Click)
        MATERIAL: BOOK
        LORE:
        - ''
        - <gray>Open the queue and pick a ladder.
        - <gray>Switch between <yellow>Unranked <gray>and <red>Ranked
        - <gray>at the bottom of the menu.
    UNRANKED:
      SLOT: 0
      ITEM:
        NAME: <yellow>Unranked Queue <gray>(Right-Click)
        MATERIAL: WOODEN_SWORD
        DURABILITY: 100
    RANKED:
      SLOT: 1
      ITEM:
        NAME: <red>Ranked Queue <gray>(Right-Click)
        MATERIAL: IRON_SWORD
    COSMETICS:
      SLOT: 4
      ITEM:
        NAME: <light_purple>Cosmetics Hub <gray>(Right-Click)
        MATERIAL: NETHER_STAR
        LORE:
        - ''
        - <gray>Customize your style with
        - <white>Armor Trims<gray>, <white>Shield Layouts<gray>,
        - and <white>Death Effects<gray>.
        - ''
        - <yellow>Open the cosmetics menu.
        ENCHANTMENTS:
        - DURABILITY:1
        FLAGS:
        - HIDE_ENCHANTS
    ENABLE-SPECTATE-MODE:
      SLOT: -1
      ITEM:
        NAME: <green>Enable <yellow>Spectate Mode <gray>(Right-Click)
        MATERIAL: REDSTONE_TORCH
    PARTY-CREATE:
      SLOT: 7
      ITEM:
        NAME: <light_purple>Create Party <gray>(Right-Click)
        MATERIAL: NAME_TAG
    PARTY-JOIN:
      SLOT: 6
      ITEM:
        NAME: <green>Join Party <gray>(Right-Click)
        MATERIAL: LIME_DYE
        LORE:
        - ''
        - <gray>Join a <green>public party <gray>without
        - <gray>asking for an invite.
        - ''
        - <yellow>Open the public party list.
    SETTINGS:
      SLOT: -1
      ITEM:
        NAME: <green>Settings <gray>(Right-Click)
        MATERIAL: CLOCK
        AMOUNT: 1
        ENCHANTMENTS:
        - DURABILITY:1
      FLAGS:
      - HIDE_POTION_EFFECTS
    KIT-EDITOR:
      SLOT: 8
      ITEM:
        NAME: <gold>Kit Editor <gray>(Right-Click)
        MATERIAL: WRITABLE_BOOK
    SETUP:
      SLOT: -1
      ITEM:
        NAME: <red>Manage Server <gray>(Right-Click)
        MATERIAL: REDSTONE
    STAFF-MODE:
      SLOT: -1
      ITEM:
        NAME: <green>Enable <light_purple>Staff Mode <gray>(Right-Click)
        MATERIAL: PINK_DYE
    REMATCH:
      SLOT: 4
      # true = the rematch item becomes the opponent's player head (MATERIAL is then ignored).
      # NAME and LORE support %opponent% (opponent's name) and %opponent_head% (their head shown inside the text).
      OPPONENT-HEAD: false
      ITEM:
        NAME: <gold>Rematch <yellow>%opponent% <gray>(Right-Click)
        MATERIAL: BLAZE_POWDER
    STATISTICS:
      SLOT: 2
      ITEM:
        NAME: <dark_green>Statistics <gray>(Right-Click)
        MATERIAL: EMERALD
  EXTRA:
    FFA:
      COMMAND: ffa
      SLOT: 1
      ITEM:
        NAME: <aqua>FFA <gray>(Right-Click)
        MATERIAL: GOLDEN_AXE
