# Party inventory items
#
PARTY:
  NORMAL:
    HOST-PARTY-GAME:
      SLOT: 0
      ITEM:
        NAME: <yellow>Host Party Event <gray>(Right-Click)
        MATERIAL: GOLDEN_AXE
    PARTY-INFO:
      SLOT: 1
      ITEM:
        NAME: <aqua>Party Information <gray>(Right-Click)
        MATERIAL: NETHER_STAR
    OTHER-PARTIES:
      SLOT: 2
      ITEM:
        NAME: <green>Other Parties <gray>(Right-Click)
        MATERIAL: PLAYER_HEAD
    LEAVE-PARTY:
      SLOT: 8
      ITEM:
        NAME: <red>Leave Party <gray>(Right-Click)
        MATERIAL: RED_DYE
    PARTY-SETTINGS:
      SLOT: 4
      ITEM:
        NAME: <gold>Party Settings <gray>(Right-Click)
        MATERIAL: CLOCK
    PARTY-KIT-EDITOR:
      SLOT: 7
      ITEM:
        NAME: <gold>Kit Editor <gray>(Right-Click)
        MATERIAL: BOOK
  EXTRA: null
# EXTRA ITEMS LIKE UPPER
#
# Queue items
#
QUEUE:
  MATCH:
    NORMAL:
      LEAVE-MATCH-QUEUE:
        SLOT: 4
        ITEM:
          NAME: <red>Leave Queue <gray>(Right-Click)
          MATERIAL: RED_DYE
    EXTRA: null
  # EXTRA ITEMS LIKE UPPER
  EVENT:
    NORMAL:
      LEAVE-EVENT-QUEUE:
        SLOT: 4
        ITEM:
          NAME: <red>Leave <yellow>%event% <red>Event Queue <gray>(Right-Click)
          MATERIAL: RED_DYE
    EXTRA: null
# EXTRA ITEMS LIKE UPPER
#
# Spectator items
#
SPECTATOR:
  LOBBY:
    NORMAL:
      MENU:
        SLOT: 5
        ITEM:
          NAME: <aqua>Spectate Menu <gray>(Right-Click)
          MATERIAL: PAPER
      DISABLE:
        SLOT: 4
        ITEM:
          NAME: <red>Disable <yellow>Spectate Mode <gray>(Right-Click)
          MATERIAL: REDSTONE_TORCH
      RANDOM:
        SLOT: 3
        ITEM:
          NAME: <green>Spectate Random Match <gray>(Right-Click)
          MATERIAL: COMPASS
    EXTRA: null
  # EXTRA ITEMS LIKE UPPER
  MATCH:
    NORMAL:
      MENU:
        SLOT: 5
        ITEM:
          NAME: <aqua>Spectate Menu <gray>(Right-Click)
          MATERIAL: PAPER
      RANDOM:
        SLOT: 4
        ITEM:
          NAME: <light_purple>Spectate Random Match <gray>(Right-Click)
          MATERIAL: COMPASS
      TARGETS:
        SLOT: 3
        ITEM:
          NAME: <yellow>Fighters <gray>(Right-Click)
          MATERIAL: ENDER_EYE
      SHOW-SPECTATORS:
        SLOT: 0
        ITEM:
          NAME: <yellow>Show Spectators <gray>(Right-Click)
          MATERIAL: GRAY_DYE
      HIDE-SPECTATORS:
        SLOT: 0
        ITEM:
          NAME: <yellow>Hide Spectators <gray>(Right-Click)
          MATERIAL: LIME_DYE
      LEAVE:
        SLOT: 8
        ITEM:
          NAME: <red>Stop Spectating <gray>(Right-Click)
          MATERIAL: RED_DYE
    ELIMINATED-TARGETS: # Players eliminated from a party match that keeps going get the Fighters item (NORMAL.TARGETS.ITEM) to teleport to living fighters.
      ENABLED: true
      SLOT: 4
    EXTRA: null
  # EXTRA ITEMS LIKE UPPER
  EVENT:
    NORMAL:
      LEAVE:
        SLOT: 8
        ITEM:
          NAME: <red>Stop Spectating <gray>(Right-Click)
          MATERIAL: RED_DYE
    EXTRA: null
  # EXTRA ITEMS LIKE UPPER
  FFA:
    NORMAL:
      LEAVE:
        SLOT: 8
        ITEM:
          NAME: <red>Stop Spectating <gray>(Right-Click)
          MATERIAL: RED_DYE
    EXTRA: null
